<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Blog educativo sobre el sistema reproductor humano para estudiantes de primaria" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    
    <title>Aprende Sobre el Cuerpo Humano - Blog Educativo</title>

    <!--
      Aplica el tema guardado ANTES del primer pintado. Sin esto la app
      arranca en claro y salta a oscuro cuando React monta (flash blanco).
    -->
    <script>
      (function () {
        try {
          var tema = localStorage.getItem('ar-tema') || 'sistema';
          var oscuro = tema === 'oscuro'
            || (tema === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', oscuro ? 'oscuro' : 'claro');
          document.documentElement.setAttribute('data-accent', localStorage.getItem('ar-acento') || 'turquesa');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'claro');
          document.documentElement.setAttribute('data-accent', 'turquesa');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
